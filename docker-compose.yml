# Full stack: nginx-served SPA -> FastAPI -> Redis queue -> worker.
# The api and worker run the same image with different commands; they share the
# job directory through a named volume because the worker writes the output the
# api later serves.

services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      FITPDF_DATA_DIR: /data
      # nginx in the frontend container sets X-Real-IP; nothing else is trusted.
      FITPDF_CLIENT_IP_HEADERS: X-Real-IP
    volumes:
      - fitpdf-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    command: python -m fitpdf.web.worker
    environment:
      REDIS_URL: redis://redis:6379/0
      FITPDF_DATA_DIR: /data
    volumes:
      - fitpdf-data:/data
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  fitpdf-data:
