<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { width: 280px; margin: 0; padding: 14px 16px; font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: #1e293b; }
  h1 { font-size: 15px; margin: 0 0 6px; color: #2451e0; }
  p { margin: 6px 0; }
  .muted { color: #64748b; font-size: 12px; }
  label { display: flex; gap: 8px; align-items: center; margin: 10px 0; font-weight: 600; }
  a { color: #2451e0; }
</style>
</head>
<body>
  <h1>FitFileSize</h1>
  <p>When you pick a file in an upload form that states a limit, like "20 KB to 50 KB" or "200 x 230 pixels", and the file breaks it, you get an offer to fit it.</p>
  <label><input type="checkbox" id="enabled" /> Check files I pick</label>
  <p class="muted">Your file is sent to fitfilesize.com only when you click "Fit it", and is deleted from the server once it is fitted. <a href="https://fitfilesize.com/privacy.html" target="_blank">Privacy</a></p>
  <script src="popup.js"></script>
</body>
</html>
