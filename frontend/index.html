<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Compress a PDF or image to fit under any upload limit, like 200 KB or 1 MB. Free, no sign-up, and your file is deleted within minutes."
    />
    <!-- The brand name on its own. scripts/seo-pages.mjs reads it for page
         titles and structured data, since <title> below is a full phrase. -->
    <meta name="application-name" content="FitFileSize" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0e13" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Apply a saved light/dark choice before first paint. The pages are
         pre-rendered, so waiting for React would flash the system theme
         first. Storage can throw (private mode, blocked site data), and then
         the system theme simply stays. See components/ThemeToggle.tsx. -->
    <script>
      try {
        var t = localStorage.getItem('fitfilesize-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <title>FitFileSize | Compress a PDF or image to any size limit</title>

    <!-- Cairn: self-hosted analytics. No cookies, no storage, IPs hashed with a
         salt that rotates daily. https://github.com/Gautamstar/cairn
         data-site keeps the pre-rename id so the traffic history stays in one
         place; it is an internal key, never shown to visitors. -->
    <script
      defer
      src="https://d1fspum1n48e1s.cloudfront.net/cairn.js"
      data-site="fitmit"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
