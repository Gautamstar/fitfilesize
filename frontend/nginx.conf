server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads go through here, so the limit has to clear FITPDF_MAX_UPLOAD or
    # nginx rejects the request before FastAPI ever sees it.
    client_max_body_size 64m;

    # Vite emits content-hashed filenames, so these can never go stale.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The progress endpoint is Server-Sent Events. Buffering would hold
        # every event until the response closed, which is to say it would
        # break the live progress entirely.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location = /health {
        proxy_pass http://api:8000/health;
    }

    # Single-page app: unknown paths are client-side routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
